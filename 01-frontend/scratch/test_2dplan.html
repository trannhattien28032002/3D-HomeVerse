<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tiny Home - 2D Blueprint Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#7c5800",
                      "on-primary-container": "#674900",
                      "surface-dim": "#dddad1",
                      "inverse-on-surface": "#f4f0e7",
                      "error-container": "#ffdad6",
                      "error": "#ba1a1a",
                      "background": "#fdf9f0",
                      "primary-container": "#f8b400",
                      "on-primary": "#ffffff",
                      "surface": "#fdf9f0",
                      "on-primary-fixed": "#271900",
                      "inverse-primary": "#ffbb16",
                      "surface-container-highest": "#e6e2d9",
                      "surface-bright": "#fdf9f0",
                      "primary-fixed-dim": "#ffbb16",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#5e4200",
                      "on-secondary-fixed": "#062104",
                      "primary-fixed": "#ffdea6",
                      "tertiary-fixed": "#ffdad8",
                      "on-secondary": "#ffffff",
                      "on-background": "#1c1c17",
                      "surface-container-low": "#f7f3ea",
                      "on-tertiary-fixed-variant": "#832428",
                      "on-tertiary-fixed": "#410006",
                      "surface-variant": "#e6e2d9",
                      "on-error-container": "#93000a",
                      "inverse-surface": "#31312b",
                      "tertiary-container": "#ffa9a6",
                      "secondary-fixed": "#caecbc",
                      "outline": "#837560",
                      "secondary-fixed-dim": "#afd0a1",
                      "secondary": "#496640",
                      "on-secondary-fixed-variant": "#324e2a",
                      "tertiary-fixed-dim": "#ffb3b0",
                      "on-error": "#ffffff",
                      "secondary-container": "#caecbc",
                      "on-surface-variant": "#504532",
                      "on-surface": "#1c1c17",
                      "primary": "#7c5800",
                      "on-tertiary-container": "#8c2c2f",
                      "outline-variant": "#d5c4ac",
                      "surface-container": "#f1eee5",
                      "surface-container-lowest": "#ffffff",
                      "tertiary": "#a23c3e",
                      "surface-container-high": "#ece8df",
                      "on-secondary-container": "#4f6c45"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-max": "1280px",
                      "margin-desktop": "40px",
                      "gutter": "24px",
                      "unit": "8px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "headline-sm": [
                              "Cinzel"
                      ],
                      "label-lg": [
                              "Nunito Sans"
                      ],
                      "headline-xl": [
                              "Cinzel"
                      ],
                      "headline-md": [
                              "Cinzel"
                      ],
                      "headline-lg": [
                              "Cinzel"
                      ],
                      "body-md": [
                              "Nunito Sans"
                      ],
                      "label-sm": [
                              "Nunito Sans"
                      ],
                      "body-lg": [
                              "Nunito Sans"
                      ],
                      "body-sm": [
                              "Nunito Sans"
                      ]
              },
              "fontSize": {
                      "headline-sm": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-lg": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-xl": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "0.02em",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-sm": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "18px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-sm": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        .blueprint-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(248,180,0,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(248,180,0,0.1) 1px, transparent 1px);
        }
        .blueprint-grid-major {
            background-size: 200px 200px;
            background-image: 
                linear-gradient(to right, rgba(248,180,0,0.2) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(248,180,0,0.2) 2px, transparent 2px);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen w-screen overflow-hidden flex flex-col">
<!-- TopNavBar -->
<header class="fixed docked full-width top-0 z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-unit h-16 bg-surface/60 dark:bg-inverse-surface/60 backdrop-blur-xl border-b border-surface-variant/30 shadow-[0_0_15px_rgba(248,180,0,0.15)]">
<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">
            Tiny Home
        </div>
<div class="flex gap-4 items-center">
<button class="text-on-surface-variant hover:bg-primary-container/20 hover:text-primary transition-all duration-300 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">photo_camera</span>
</button>
<button class="text-on-surface-variant hover:bg-primary-container/20 hover:text-primary transition-all duration-300 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">grid_on</span>
</button>
<button class="text-on-surface-variant hover:bg-primary-container/20 hover:text-primary transition-all duration-300 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</header>
<!-- Canvas Area -->
<main class="flex-grow relative pt-16 pb-32 blueprint-grid w-full h-full">
<div class="absolute inset-0 blueprint-grid-major pointer-events-none"></div>
<!-- Floorplan Representation -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[400px] bg-surface-container-low/50 border-4 border-outline rounded-xl flex shadow-[inset_0_0_20px_rgba(124,88,0,0.05)]">
<!-- Room 1 (Main Living) -->
<div class="flex-grow border-r-4 border-outline relative p-4 flex items-center justify-center ring-2 ring-primary/40 shadow-[0_0_15px_rgba(248,180,0,0.2)]">
<div class="absolute top-0 right-10 w-20 h-4 border-b-4 border-outline bg-surface-container-highest transform -translate-y-full"></div> <!-- Door opening simulation -->
<div class="absolute bottom-10 left-0 h-24 w-4 border-r-4 border-outline bg-surface-container-highest transform -translate-x-full"></div> <!-- Window simulation -->
<span class="font-label-lg text-label-lg text-on-surface-variant/50 uppercase tracking-widest">Main Hall</span>
<!-- Scale Handles -->
<div class="absolute -top-2 -left-2 w-4 h-4 bg-primary rounded-full border-2 border-white cursor-nwse-resize shadow-sm z-10"></div>
<div class="absolute -top-2 -right-2 w-4 h-4 bg-primary rounded-full border-2 border-white cursor-nesw-resize shadow-sm z-10"></div>
<div class="absolute -bottom-2 -left-2 w-4 h-4 bg-primary rounded-full border-2 border-white cursor-nesw-resize shadow-sm z-10"></div>
<div class="absolute -bottom-2 -right-2 w-4 h-4 bg-primary rounded-full border-2 border-white cursor-nwse-resize shadow-sm z-10"></div>
<div class="absolute top-1/2 -left-2 -translate-y-1/2 w-3 h-3 bg-primary-container rounded-full border border-white cursor-ew-resize shadow-sm z-10"></div>
<div class="absolute top-1/2 -right-2 -translate-y-1/2 w-3 h-3 bg-primary-container rounded-full border border-white cursor-ew-resize shadow-sm z-10"></div>
<div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-primary-container rounded-full border border-white cursor-ns-resize shadow-sm z-10"></div>
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-primary-container rounded-full border border-white cursor-ns-resize shadow-sm z-10"></div></div>
<div class="w-[200px] flex flex-col">
<!-- Room 2 (Bed) -->
<div class="h-1/2 border-b-4 border-outline relative p-4 flex items-center justify-center">
<span class="font-label-lg text-label-lg text-on-surface-variant/50 uppercase tracking-widest">Chamber</span>
</div>
<!-- Room 3 (Bath) -->
<div class="h-1/2 relative p-4 flex items-center justify-center bg-surface-container-highest/30">
<span class="font-label-lg text-label-lg text-on-surface-variant/50 uppercase tracking-widest">Wash</span>
</div>
</div>
</div><!-- Transform Tooltip -->
<div class="absolute top-[45%] left-[55%] z-50 bg-surface/90 backdrop-blur-xl border border-primary-container/30 rounded-xl p-3 shadow-xl flex flex-col gap-3 min-w-[180px] animate-in fade-in zoom-in duration-200">
<div class="flex items-center justify-between border-b border-surface-variant/30 pb-2 mb-1">
<span class="font-label-lg text-[12px] uppercase tracking-wider text-primary">Transform</span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant cursor-pointer">close</span>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col gap-1">
<label class="text-[10px] uppercase font-bold text-on-surface-variant/70">Width</label>
<div class="flex items-center gap-1 bg-surface-container-low rounded px-2 py-1">
<input class="bg-transparent border-none p-0 w-full text-label-sm focus:ring-0 text-on-surface" type="text" value="1.2x"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="text-[10px] uppercase font-bold text-on-surface-variant/70">Height</label>
<div class="flex items-center gap-1 bg-surface-container-low rounded px-2 py-1">
<input class="bg-transparent border-none p-0 w-full text-label-sm focus:ring-0 text-on-surface" type="text" value="1.0x"/>
</div>
</div>
</div>
<div class="flex items-center justify-between mt-1">
<span class="text-label-sm text-on-surface-variant">Maintain Ratio</span>
<button class="text-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</button>
</div>
<!-- Arrow tail -->
<div class="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 bg-surface/90 border-l border-b border-primary-container/30 rotate-45"></div>
</div>
<!-- Active Drawing Reticle -->
<div class="absolute top-[40%] left-[30%] w-10 h-10 border-2 border-primary-container rounded-full flex items-center justify-center animate-pulse">
<div class="w-1 h-1 bg-primary rounded-full"></div>
</div>
</main>
<!-- Expanded Build Menu -->
<div class="fixed bottom-[100px] left-1/2 -translate-x-1/2 z-40 bg-surface-container/90 backdrop-blur-2xl border border-primary-container/30 shadow-[0_8px_32px_rgba(124,88,0,0.15)] rounded-full px-6 py-3 flex gap-6 items-center">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300 p-2 rounded-xl">
<span class="material-symbols-outlined mb-1">forest</span>
<span class="font-label-sm text-label-sm">Timber</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300 p-2 rounded-xl">
<span class="material-symbols-outlined mb-1">landscape</span>
<span class="font-label-sm text-label-sm">Stone</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container/20 text-primary border border-primary/30 rounded-xl p-2 shadow-[inset_0_0_10px_rgba(248,180,0,0.2)]">
<span class="material-symbols-outlined mb-1 text-primary">view_module</span>
<span class="font-label-sm text-label-sm text-primary font-bold">Brick</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300 p-2 rounded-xl">
<span class="material-symbols-outlined mb-1">format_paint</span>
<span class="font-label-sm text-label-sm">Plaster</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2 bg-surface-container/80 dark:bg-inverse-surface/80 backdrop-blur-2xl rounded-full mx-auto mb-margin-mobile w-fit max-w-[95%] border border-primary-container/30 shadow-[0_8px_32px_rgba(124,88,0,0.2)] overflow-x-auto custom-scrollbar">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">select_all</span>
<span class="font-label-sm text-label-sm">Select</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">ads_click</span>
<span class="font-label-sm text-label-sm">Multi</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full p-3 shadow-[0_0_12px_rgba(248,180,0,0.4)] min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]" style="font-variation-settings: 'FILL' 1;">construction</span>
<span class="font-label-sm text-label-sm font-bold">Build</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">chair</span>
<span class="font-label-sm text-label-sm">Decor</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">texture</span>
<span class="font-label-sm text-label-sm">Color</span>
</button>
<div class="w-px h-8 bg-outline-variant/50 mx-1"></div> <!-- Separator -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">rotate_left</span>
<span class="font-label-sm text-label-sm">Left</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">rotate_right</span>
<span class="font-label-sm text-label-sm">Right</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">vertical_align_top</span>
<span class="font-label-sm text-label-sm">Top</span>
</button>
<div class="w-px h-8 bg-outline-variant/50 mx-1"></div> <!-- Separator -->
<button class="flex flex-col items-center justify-center text-primary bg-primary-container/10 border border-primary/20 rounded-xl p-3 min-w-[60px] shadow-sm">
<span class="material-symbols-outlined mb-1 text-[20px]">view_quilt</span>
<span class="font-label-sm text-label-sm font-bold">2D</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-3 min-w-[60px] hover:bg-primary-fixed/30 hover:scale-110 transition-all duration-300">
<span class="material-symbols-outlined mb-1 text-[20px]">view_in_ar</span>
<span class="font-label-sm text-label-sm">3D</span>
</button>
</nav>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(124, 88, 0, 0.2);
            border-radius: 4px;
        }
    </style>
</body></html>
