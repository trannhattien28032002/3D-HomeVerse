<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Enter the threshold of your sanctuary</p>

<form action="#" class="space-y-6" method="POST">
<div class="space-y-2">

<div class="relative group">

</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="key">key</span>
